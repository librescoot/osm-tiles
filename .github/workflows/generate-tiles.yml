name: Generate Custom Shortbread Tiles - Germany + Benelux + France + Italy + Spain + Austria + Switzerland

permissions:
  contents: write

on:
  schedule:
    - cron: '0 0 1 * *'  # Monthly on the 1st at midnight UTC
  workflow_dispatch:
    inputs:
      regions:
        description: "all or comma-separated region IDs (e.g. alsace,islas-baleares,graz,vienna,zurich)"
        required: true
        type: string
        default: all
      reuse_run_id:
        description: "Optional run ID whose tiles_* artifacts to reuse: skips the tile build and only builds deltas and publishes. Use with regions=all (or the same set)."
        required: false
        type: string
        default: ''

jobs:
  select_regions:
    runs-on: ubuntu-24.04
    outputs:
      regions: ${{ steps.choose.outputs.regions }}
      count: ${{ steps.choose.outputs.count }}
      needs_austria: ${{ steps.choose.outputs.needs_austria }}
      needs_switzerland: ${{ steps.choose.outputs.needs_switzerland }}
    steps:
      - uses: actions/checkout@v7
      - name: Select regions for this run
        id: choose
        env:
          REGION_SET: ${{ inputs.regions || 'all' }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os

          with open('.github/regions.json') as f:
              regions = json.load(f)
          selection = os.environ['REGION_SET'].strip()
          if selection != 'all':
              names = [name.strip() for name in selection.split(',')]
              available = {region['name']: region for region in regions}
              if not names or any(name not in available for name in names):
                  raise SystemExit(f'Unknown or empty region in: {selection}')
              if len(names) != len(set(names)):
                  raise SystemExit(f'Duplicate region in: {selection}')
              regions = [available[name] for name in names]
          print('regions=' + json.dumps(regions, separators=(',', ':')))
          print('count=' + str(len(regions)))
          print('needs_austria=' + str(any(r['name'] in ('graz', 'vienna') for r in regions)).lower())
          print('needs_switzerland=' + str(any(r['name'] == 'zurich' for r in regions)).lower())
          PY

  prepare_austria:
    needs: select_regions
    if: needs.select_regions.outputs.needs_austria == 'true' && inputs.reuse_run_id == ''
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7
      - name: Clip Graz and Vienna from Geofabrik Austria
        run: |
          set -euo pipefail
          command -v osmium >/dev/null || { sudo apt-get update && sudo apt-get install -y osmium-tool; }
          work="${{ runner.temp }}/osm-austria-${{ github.run_id }}-${{ github.run_attempt }}"
          mkdir -p "$work"
          test "$(df -Pk "$work" | awk 'NR==2 {print $4}')" -ge 3145728 || { echo 'Need 3 GB free to prepare Austrian city extracts' >&2; exit 1; }
          bash download-pbf.sh https://download.geofabrik.de/europe/austria-latest.osm.pbf "$work/austria.osm.pbf"
          osmium extract -s smart -S types=multipolygon,boundary \
            -b 15.15,46.90,15.70,47.25 \
            -o "$work/graz.osm.pbf" "$work/austria.osm.pbf"
          osmium extract -s smart -S types=multipolygon,boundary \
            -b 16.05,48.03,16.72,48.42 \
            -o "$work/vienna.osm.pbf" "$work/austria.osm.pbf"
          rm "$work/austria.osm.pbf"
          test -s "$work/graz.osm.pbf" && test -s "$work/vienna.osm.pbf"
          ls -lh "$work"/*.osm.pbf

      - name: Upload Austrian city extracts
        uses: actions/upload-artifact@v7
        with:
          name: austrian-city-pbfs
          path: ${{ runner.temp }}/osm-austria-${{ github.run_id }}-${{ github.run_attempt }}/*.osm.pbf
          compression-level: 0
          if-no-files-found: error

      - name: Clean up Austrian extracts
        if: always()
        run: rm -rf "${{ runner.temp }}/osm-austria-${{ github.run_id }}-${{ github.run_attempt }}"

  prepare_switzerland:
    needs: select_regions
    if: needs.select_regions.outputs.needs_switzerland == 'true' && inputs.reuse_run_id == ''
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7
      - name: Clip canton Zürich from Geofabrik Switzerland
        run: |
          set -euo pipefail
          command -v osmium >/dev/null || { sudo apt-get update && sudo apt-get install -y osmium-tool; }
          work="${{ runner.temp }}/osm-switzerland-${{ github.run_id }}-${{ github.run_attempt }}"
          mkdir -p "$work"
          test "$(df -Pk "$work" | awk 'NR==2 {print $4}')" -ge 3145728 || { echo 'Need 3 GB free to prepare the Zürich extract' >&2; exit 1; }
          bash download-pbf.sh https://download.geofabrik.de/europe/switzerland-latest.osm.pbf "$work/switzerland.osm.pbf"
          osmium extract -s smart -S types=multipolygon,boundary \
            -b 8.08,46.97,9.27,47.88 \
            -o "$work/zurich.osm.pbf" "$work/switzerland.osm.pbf"
          rm "$work/switzerland.osm.pbf"
          test -s "$work/zurich.osm.pbf"
          ls -lh "$work/zurich.osm.pbf"

      - name: Upload Zürich extract
        uses: actions/upload-artifact@v7
        with:
          name: swiss-canton-pbf
          path: ${{ runner.temp }}/osm-switzerland-${{ github.run_id }}-${{ github.run_attempt }}/zurich.osm.pbf
          compression-level: 0
          if-no-files-found: error

      - name: Clean up Swiss extract
        if: always()
        run: rm -rf "${{ runner.temp }}/osm-switzerland-${{ github.run_id }}-${{ github.run_attempt }}"

  # Tilemaker is built from a pinned commit instead of a floating image tag.
  # Building once and passing the image to the region jobs keeps 25 matrix jobs
  # from compiling the same source and guarantees they all use identical bytes.
  prepare_tilemaker:
    if: inputs.reuse_run_id == ''
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7

      - name: Build tilemaker image
        run: |
          set -euo pipefail
          docker build -t tilemaker-deterministic tools/tilemaker

      - name: Save tilemaker image
        run: |
          set -euo pipefail
          command -v zstd >/dev/null || { sudo apt-get update && sudo apt-get install -y zstd; }
          work="${{ runner.temp }}/tilemaker-image-${{ github.run_id }}-${{ github.run_attempt }}"
          mkdir -p "$work"
          docker save tilemaker-deterministic | zstd -3 -T0 -q -o "$work/tilemaker-deterministic.tar.zst"
          ls -lh "$work"

      - name: Upload tilemaker image
        uses: actions/upload-artifact@v7
        with:
          name: tilemaker-image
          path: ${{ runner.temp }}/tilemaker-image-${{ github.run_id }}-${{ github.run_attempt }}/tilemaker-deterministic.tar.zst
          compression-level: 0
          if-no-files-found: error

      - name: Clean up tilemaker image
        if: always()
        run: rm -rf "${{ runner.temp }}/tilemaker-image-${{ github.run_id }}-${{ github.run_attempt }}"

  generate_state_tiles:
    needs: [select_regions, prepare_tilemaker, prepare_austria, prepare_switzerland]
    if: >-
      always() && inputs.reuse_run_id == '' && needs.select_regions.result == 'success' &&
      needs.prepare_tilemaker.result == 'success' &&
      (needs.prepare_austria.result == 'success' || (needs.prepare_austria.result == 'skipped' && needs.select_regions.outputs.needs_austria == 'false')) &&
      (needs.prepare_switzerland.result == 'success' || (needs.prepare_switzerland.result == 'skipped' && needs.select_regions.outputs.needs_switzerland == 'false'))
    runs-on: self-hosted
    strategy:
      fail-fast: false
      matrix:
        state: ${{ fromJSON(needs.select_regions.outputs.regions) }}
    steps:
      - uses: actions/checkout@v7

      - name: Download Austrian city extract
        if: matrix.state.name == 'graz' || matrix.state.name == 'vienna'
        uses: actions/download-artifact@v8
        with:
          name: austrian-city-pbfs
          path: /tmp/austrian-city-pbfs-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.state.name }}

      - name: Stage Austrian city PBF
        if: matrix.state.name == 'graz' || matrix.state.name == 'vienna'
        run: |
          cp /tmp/austrian-city-pbfs-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.state.name }}/${{ matrix.state.name }}.osm.pbf /tmp/${{ matrix.state.name }}.osm.pbf
          test -s /tmp/${{ matrix.state.name }}.osm.pbf

      - name: Download Zürich extract
        if: matrix.state.name == 'zurich'
        uses: actions/download-artifact@v8
        with:
          name: swiss-canton-pbf
          path: /tmp/swiss-canton-pbf-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Stage Zürich PBF
        if: matrix.state.name == 'zurich'
        run: |
          cp /tmp/swiss-canton-pbf-${{ github.run_id }}-${{ github.run_attempt }}/zurich.osm.pbf /tmp/zurich.osm.pbf
          test -s /tmp/zurich.osm.pbf

      - name: Download OSM PBF for ${{ matrix.state.name }}
        if: matrix.state.name != 'graz' && matrix.state.name != 'vienna' && matrix.state.name != 'zurich'
        run: |
          echo "Downloading ${{ matrix.state.name }} PBF file..."
          bash download-pbf.sh "${{ matrix.state.url }}" "/tmp/${{ matrix.state.name }}.osm.pbf"
          echo "Download completed for ${{ matrix.state.name }}"
          ls -lh /tmp/${{ matrix.state.name }}.osm.pbf

      - name: Download tilemaker image
        uses: actions/download-artifact@v8
        with:
          name: tilemaker-image
          path: ${{ runner.temp }}/tilemaker-image-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Load tilemaker image
        run: |
          set -euo pipefail
          zstd -d -q -f "${{ runner.temp }}/tilemaker-image-${{ github.run_id }}-${{ github.run_attempt }}/tilemaker-deterministic.tar.zst" \
            -o "${{ runner.temp }}/tilemaker-image-${{ github.run_id }}-${{ github.run_attempt }}/tilemaker-deterministic.tar"
          docker load -i "${{ runner.temp }}/tilemaker-image-${{ github.run_id }}-${{ github.run_attempt }}/tilemaker-deterministic.tar"
          rm -f "${{ runner.temp }}/tilemaker-image-${{ github.run_id }}-${{ github.run_attempt }}/tilemaker-deterministic.tar"
          docker image inspect tilemaker-deterministic >/dev/null

      - name: Generate tiles for ${{ matrix.state.name }}
        run: |
          echo "Generating tiles for ${{ matrix.state.name }}..."
          mkdir -p /tmp/tilemaker-artifacts
          sudo docker run --rm \
            -v $(pwd):/var/tm \
            -v /tmp:/tmp \
            -w /var/tm \
            tilemaker-deterministic \
              --threads 4 \
              --config tilemaker/config.json \
              --process tilemaker/process.lua \
              --input /tmp/${{ matrix.state.name }}.osm.pbf \
              --output /tmp/tilemaker-artifacts/tiles_${{ matrix.state.name }}.mbtiles
          echo "Tile generation completed for ${{ matrix.state.name }}"
          # Docker tilemaker runs as root and leaves the .mbtiles owned by
          # root with read-only perms for everyone else. The next step opens
          # it for writing via sqlite3 to add the geocoding-index tables, so
          # hand ownership back to the runner user.
          sudo chown $(id -u):$(id -g) /tmp/tilemaker-artifacts/tiles_${{ matrix.state.name }}.mbtiles
          ls -lh /tmp/tilemaker-artifacts/tiles_${{ matrix.state.name }}.mbtiles

      - name: Set up Python for geocoding index
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install geocoding index dependencies
        run: pip install -r requirements.txt

      - name: Build geocoding index for ${{ matrix.state.name }}
        run: |
          python3 build_places.py \
            /tmp/${{ matrix.state.name }}.osm.pbf \
            /tmp/tilemaker-artifacts/tiles_${{ matrix.state.name }}.mbtiles
          ls -lh /tmp/tilemaker-artifacts/tiles_${{ matrix.state.name }}.mbtiles

      - name: Verify tiles for ${{ matrix.state.name }}
        run: |
          python3 tools/verify-mbtiles.py \
            /tmp/tilemaker-artifacts/tiles_${{ matrix.state.name }}.mbtiles

      # The delta and release jobs run on this same runner, so they take the
      # file from disk instead of downloading it again; the artifact below is
      # only the fallback (and what a branch run keeps for review).
      - name: Keep tiles for ${{ matrix.state.name }} on the runner
        env:
          TILE_CACHE_DIR: ${{ vars.TILE_CACHE_DIR }}
        run: |
          tools/tile-cache.sh store "${{ github.run_id }}" "${{ matrix.state.name }}" \
            "/tmp/tilemaker-artifacts/tiles_${{ matrix.state.name }}.mbtiles"

      - name: Upload tiles for ${{ matrix.state.name }}
        uses: actions/upload-artifact@v7
        with:
          name: tiles_${{ matrix.state.name }}
          path: /tmp/tilemaker-artifacts/tiles_${{ matrix.state.name }}.mbtiles

      - name: Free runner disk space
        if: always()
        run: |
          rm -f /tmp/${{ matrix.state.name }}.osm.pbf /tmp/tilemaker-artifacts/tiles_${{ matrix.state.name }}.mbtiles
          rm -rf /tmp/austrian-city-pbfs-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.state.name }} \
            /tmp/swiss-canton-pbf-${{ github.run_id }}-${{ github.run_attempt }}

  # One job per region: each downloads only its own tile artifact and the base
  # releases it patches against, then frees its disk. The matrix keeps the whole
  # tileset from being on one runner at once (about 5 GB) and bounds how many
  # regions work in parallel. Set the repository variable MAP_DELTA_CONCURRENCY
  # to change the bound; the default is 4.
  create_deltas:
    needs: [select_regions, generate_state_tiles]
    if: >-
      always() && needs.select_regions.result == 'success' &&
      (needs.generate_state_tiles.result == 'success' ||
       (inputs.reuse_run_id != '' && needs.generate_state_tiles.result == 'skipped'))
    runs-on: self-hosted
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(vars.MAP_DELTA_CONCURRENCY || '4') }}
      matrix:
        state: ${{ fromJSON(needs.select_regions.outputs.regions) }}
    steps:
      - uses: actions/checkout@v7

      - name: Look for ${{ matrix.state.name }} tiles on the runner
        id: local
        env:
          TILE_CACHE_DIR: ${{ vars.TILE_CACHE_DIR }}
        run: |
          if tools/tile-cache.sh fetch "${{ inputs.reuse_run_id || github.run_id }}" \
               "${{ matrix.state.name }}" "artifacts/${{ matrix.state.name }}"; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "Using the tiles already on this runner"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download tiles for ${{ matrix.state.name }}
        if: steps.local.outputs.found != 'true'
        uses: actions/download-artifact@v8
        with:
          name: tiles_${{ matrix.state.name }}
          path: artifacts/${{ matrix.state.name }}
          run-id: ${{ inputs.reuse_run_id || github.run_id }}
          github-token: ${{ github.token }}

      - name: Install HDiffPatch encoder
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 3 \
            -o "$RUNNER_TEMP/hdiffpatch.zip" \
            https://github.com/sisong/HDiffPatch/releases/download/v5.1.3/hdiffpatch_v5.1.3_bin_linux64.zip
          echo "628963bf2ee9108a97260fa5eef44acd9ec94369b76090a957c9182b3abbb558  $RUNNER_TEMP/hdiffpatch.zip" | sha256sum -c -
          unzip -j -o "$RUNNER_TEMP/hdiffpatch.zip" 'linux64/hdiffz' -d "$RUNNER_TEMP/hdiff"
          chmod 0755 "$RUNNER_TEMP/hdiff/hdiffz"
          echo "$RUNNER_TEMP/hdiff" >> "$GITHUB_PATH"

      - name: Build deltas for ${{ matrix.state.name }}
        env:
          GH_TOKEN: ${{ github.token }}
          TILE_CACHE_DIR: ${{ vars.TILE_CACHE_DIR }}
        run: |
          set -euo pipefail
          # Published bases are kept between runs, so only the release that is
          # new since last time is downloaded.
          python3 tools/create-map-deltas.py artifacts --bases 2 \
            --cache-dir "${TILE_CACHE_DIR:-$HOME/.cache/librescoot-tiles}/bases"
          find artifacts -name '*.hdelta' -exec ls -lh {} + || true

      - name: Upload deltas for ${{ matrix.state.name }}
        uses: actions/upload-artifact@v7
        with:
          name: tiles-delta-${{ matrix.state.name }}
          path: artifacts/**/*.hdelta
          if-no-files-found: ignore
          compression-level: 0

      - name: Free runner disk space
        if: always()
        run: rm -rf artifacts

  # Only main publishes: a branch run produces Actions artifacts for review, so a
  # generator change can be inspected on a scooter without touching the
  # public per-region index.
  release:
    needs: [select_regions, generate_state_tiles, create_deltas]
    runs-on: self-hosted
    if: >-
      always() && github.ref == 'refs/heads/main' &&
      (needs.generate_state_tiles.result == 'success' ||
       (inputs.reuse_run_id != '' && needs.generate_state_tiles.result == 'skipped')) &&
      (needs.create_deltas.result == 'success' || needs.create_deltas.result == 'skipped')
    steps:
      - uses: actions/checkout@v7

      - name: Look for the tiles on the runner
        id: local
        env:
          TILE_CACHE_DIR: ${{ vars.TILE_CACHE_DIR }}
        run: |
          if tools/tile-cache.sh fetch-all "${{ inputs.reuse_run_id || github.run_id }}" \
               "${{ needs.select_regions.outputs.count }}" artifacts; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "Using the tiles already on this runner"
          else
            rm -rf artifacts
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download all tile artifacts
        if: steps.local.outputs.found != 'true'
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: tiles_*
          run-id: ${{ inputs.reuse_run_id || github.run_id }}
          github-token: ${{ github.token }}

      - name: Download map deltas
        uses: actions/download-artifact@v8
        with:
          path: deltas
          pattern: tiles-delta-*
          merge-multiple: true
        continue-on-error: true

      - name: List all artifacts
        run: |
          echo "Listing all downloaded tile artifacts:"
          find artifacts -name "*.mbtiles" -type f -exec ls -lh {} \;

      - name: Set release month variable
        id: date
        run: echo "month=$(date '+%B %Y')" >> $GITHUB_OUTPUT

      # Publishes to a fresh tag every run. The old scheme rewrote "latest" in
      # place, so a download URL served different bytes depending on when it was
      # fetched: a vehicle could take a digest from the manifest and receive
      # content that no longer matched it. A tag that is never reused makes each
      # asset URL immutable, so a download that starts against one build stays
      # on that build.
      - name: Name the release
        id: publish
        run: |
          set -euo pipefail
          tag="tiles-$(date -u +%Y%m%dT%H%M%SZ)"
          count=$(find artifacts -name '*.mbtiles' -type f | wc -l)
          if [ "$count" -ne "${{ needs.select_regions.outputs.count }}" ]; then
            echo "expected ${{ needs.select_regions.outputs.count }} tile artifacts, got $count" >&2
            exit 1
          fi
          echo "publishing $count assets as $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      # A JavaScript action rather than the gh CLI: gh is not installed on the
      # self-hosted runners, and this is the action the firmware build already
      # uses on them.
      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ steps.publish.outputs.tag }}
          name: "Custom Shortbread Tiles - ${{ steps.date.outputs.month }}"
          body: "Generated from ${{ github.sha }}."
          prerelease: false
          files: |
            artifacts/**/*.mbtiles
            deltas/**/*.hdelta
          # Deltas are optional: a region without a published base has none.
          fail_on_unmatched_files: false

      # Enable after the downloads site serves the per-region index.
      - name: Generate app token for downloads rebuild
        if: vars.MAPS_INDEX_READY == 'true'
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: librescoot
          repositories: downloads.librescoot.org

      - name: Trigger downloads site rebuild
        if: vars.MAPS_INDEX_READY == 'true'
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          repository: librescoot/downloads.librescoot.org
          event-type: releases-changed

      # Built tiles are only needed while a run (or a reuse of it) still has to
      # publish them; a week is plenty and keeps the runner's disk in check.
      - name: Drop old tile runs from the runner
        if: always()
        env:
          TILE_CACHE_DIR: ${{ vars.TILE_CACHE_DIR }}
        run: tools/tile-cache.sh prune 7
