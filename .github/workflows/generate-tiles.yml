name: Generate Custom Shortbread Tiles - Germany + Benelux + France + Italy + Spain + Austria

permissions:
  contents: write

on:
  schedule:
    - cron: '0 0 1 * *'  # Monthly on the 1st at midnight UTC
  workflow_dispatch:
    inputs:
      region:
        description: "Regions to build (partial runs upload artifacts but do not publish a release)"
        required: true
        type: choice
        default: all
        options:
          - all
          - new_regions
          - berlin_brandenburg

jobs:
  select_regions:
    if: github.event_name != 'workflow_dispatch' || inputs.region != 'berlin_brandenburg'
    runs-on: ubuntu-latest
    outputs:
      regions: ${{ steps.choose.outputs.regions }}
    steps:
      - uses: actions/checkout@v4
      - name: Select regions for this run
        id: choose
        env:
          REGION_SET: ${{ inputs.region || 'all' }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os

          with open('.github/regions.json') as f:
              regions = json.load(f)
          selection = os.environ['REGION_SET']
          if selection == 'new_regions':
              names = {'alsace', 'islas-baleares', 'graz', 'vienna'}
              regions = [r for r in regions if r['name'] in names]
              if {r['name'] for r in regions} != names:
                  raise SystemExit('Missing a new region in .github/regions.json')
          elif selection != 'all':
              raise SystemExit(f'Unknown region selection: {selection}')
          print('regions=' + json.dumps(regions, separators=(',', ':')))
          PY

  prepare_austria:
    if: github.event_name != 'workflow_dispatch' || inputs.region != 'berlin_brandenburg'
    runs-on: self-hosted
    steps:
      - name: Clip Graz and Vienna from Geofabrik Austria
        run: |
          set -euo pipefail
          command -v osmium >/dev/null || { sudo apt-get update && sudo apt-get install -y osmium-tool; }
          work="${{ runner.temp }}/osm-austria-${{ github.run_id }}-${{ github.run_attempt }}"
          mkdir -p "$work"
          test "$(df -Pk "$work" | awk 'NR==2 {print $4}')" -ge 3145728 || { echo 'Need 3 GB free to prepare Austrian city extracts' >&2; exit 1; }
          wget -q -O "$work/austria.osm.pbf" https://download.geofabrik.de/europe/austria-latest.osm.pbf
          osmium extract -s smart -S types=multipolygon,boundary \
            -b 15.15,46.90,15.70,47.25 \
            -o "$work/graz.osm.pbf" "$work/austria.osm.pbf"
          osmium extract -s smart -S types=multipolygon,boundary \
            -b 16.05,48.03,16.72,48.42 \
            -o "$work/vienna.osm.pbf" "$work/austria.osm.pbf"
          rm "$work/austria.osm.pbf"
          test -s "$work/graz.osm.pbf" && test -s "$work/vienna.osm.pbf"
          ls -lh "$work"/*.osm.pbf

      - name: Upload Austrian city extracts
        uses: actions/upload-artifact@v4
        with:
          name: austrian-city-pbfs
          path: ${{ runner.temp }}/osm-austria-${{ github.run_id }}-${{ github.run_attempt }}/*.osm.pbf
          compression-level: 0
          if-no-files-found: error

      - name: Clean up Austrian extracts
        if: always()
        run: rm -rf "${{ runner.temp }}/osm-austria-${{ github.run_id }}-${{ github.run_attempt }}"

  generate_state_tiles:
    needs: [select_regions, prepare_austria]
    if: github.event_name != 'workflow_dispatch' || inputs.region != 'berlin_brandenburg'
    runs-on: self-hosted
    strategy:
      fail-fast: false
      matrix:
        state: ${{ fromJSON(needs.select_regions.outputs.regions) }}
    steps:
      - uses: actions/checkout@v4

      - name: Download Austrian city extract
        if: matrix.state.name == 'graz' || matrix.state.name == 'vienna'
        uses: actions/download-artifact@v4
        with:
          name: austrian-city-pbfs
          path: /tmp/austrian-city-pbfs-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.state.name }}

      - name: Stage Austrian city PBF
        if: matrix.state.name == 'graz' || matrix.state.name == 'vienna'
        run: ln -sf /tmp/austrian-city-pbfs-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.state.name }}/${{ matrix.state.name }}.osm.pbf /tmp/${{ matrix.state.name }}.osm.pbf

      - name: Download OSM PBF for ${{ matrix.state.name }}
        if: matrix.state.name != 'graz' && matrix.state.name != 'vienna'
        run: |
          echo "Downloading ${{ matrix.state.name }} PBF file..."
          wget -q -O /tmp/${{ matrix.state.name }}.osm.pbf ${{ matrix.state.url }}
          echo "Download completed for ${{ matrix.state.name }}"
          ls -lh /tmp/${{ matrix.state.name }}.osm.pbf

      - name: Generate tiles for ${{ matrix.state.name }}
        run: |
          echo "Generating tiles for ${{ matrix.state.name }}..."
          mkdir -p /tmp/tilemaker-artifacts
          sudo docker run --rm \
            -v $(pwd):/var/tm \
            -v /tmp:/tmp \
            -w /var/tm \
            --entrypoint tilemaker \
            versatiles/versatiles-tilemaker \
              --config tilemaker/config.json \
              --process tilemaker/process.lua \
              --input /tmp/${{ matrix.state.name }}.osm.pbf \
              --output /tmp/tilemaker-artifacts/tiles_${{ matrix.state.name }}.mbtiles
          echo "Tile generation completed for ${{ matrix.state.name }}"
          # Docker tilemaker runs as root and leaves the .mbtiles owned by
          # root with read-only perms for everyone else. The next step opens
          # it for writing via sqlite3 to add the geocoding-index tables, so
          # hand ownership back to the runner user.
          sudo chown $(id -u):$(id -g) /tmp/tilemaker-artifacts/tiles_${{ matrix.state.name }}.mbtiles
          ls -lh /tmp/tilemaker-artifacts/tiles_${{ matrix.state.name }}.mbtiles

      - name: Set up Python for geocoding index
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install geocoding index dependencies
        run: pip install -r requirements.txt

      - name: Build geocoding index for ${{ matrix.state.name }}
        run: |
          python3 build_places.py \
            /tmp/${{ matrix.state.name }}.osm.pbf \
            /tmp/tilemaker-artifacts/tiles_${{ matrix.state.name }}.mbtiles
          ls -lh /tmp/tilemaker-artifacts/tiles_${{ matrix.state.name }}.mbtiles

      - name: Upload tiles for ${{ matrix.state.name }}
        uses: actions/upload-artifact@v4
        with:
          name: tiles_${{ matrix.state.name }}
          path: /tmp/tilemaker-artifacts/tiles_${{ matrix.state.name }}.mbtiles

      - name: Free runner disk space
        if: always()
        run: |
          rm -f /tmp/${{ matrix.state.name }}.osm.pbf /tmp/tilemaker-artifacts/tiles_${{ matrix.state.name }}.mbtiles
          rm -rf /tmp/austrian-city-pbfs-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.state.name }}

  # Fast validation/deployment path for Berlin without consuming runners for
  # the full regional matrix or publishing a partial production release.
  generate_berlin_brandenburg:
    if: github.event_name == 'workflow_dispatch' && inputs.region == 'berlin_brandenburg'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Download Berlin/Brandenburg OSM PBF
        run: |
          wget -q -O /tmp/berlin_brandenburg.osm.pbf \
            https://download.geofabrik.de/europe/germany/brandenburg-latest.osm.pbf
          ls -lh /tmp/berlin_brandenburg.osm.pbf

      - name: Generate Berlin/Brandenburg tiles
        run: |
          mkdir -p /tmp/tilemaker-artifacts
          sudo docker run --rm \
            -v $(pwd):/var/tm \
            -v /tmp:/tmp \
            -w /var/tm \
            --entrypoint tilemaker \
            versatiles/versatiles-tilemaker \
              --config tilemaker/config.json \
              --process tilemaker/process.lua \
              --input /tmp/berlin_brandenburg.osm.pbf \
              --output /tmp/tilemaker-artifacts/tiles_berlin_brandenburg.mbtiles
          sudo chown $(id -u):$(id -g) \
            /tmp/tilemaker-artifacts/tiles_berlin_brandenburg.mbtiles
          ls -lh /tmp/tilemaker-artifacts/tiles_berlin_brandenburg.mbtiles

      - name: Set up Python for geocoding index
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install geocoding index dependencies
        run: pip install -r requirements.txt

      - name: Build and validate geocoding index
        run: |
          python3 build_places.py \
            /tmp/berlin_brandenburg.osm.pbf \
            /tmp/tilemaker-artifacts/tiles_berlin_brandenburg.mbtiles
          python3 - <<'PY'
          import sqlite3
          path = "/tmp/tilemaker-artifacts/tiles_berlin_brandenburg.mbtiles"
          db = sqlite3.connect(path)
          count = db.execute("SELECT COUNT(*) FROM place_street_tiles").fetchone()[0]
          if count <= 0:
              raise SystemExit("place_street_tiles is empty")
          print(f"validated {count} indexed street/tile rows")
          db.close()
          PY
          ls -lh /tmp/tilemaker-artifacts/tiles_berlin_brandenburg.mbtiles

      - name: Upload Berlin/Brandenburg tiles
        uses: actions/upload-artifact@v4
        with:
          name: tiles_berlin_brandenburg
          path: /tmp/tilemaker-artifacts/tiles_berlin_brandenburg.mbtiles

  release:
    needs: [generate_state_tiles]
    runs-on: self-hosted
    # Publish only complete runs from main; partial builds remain workflow artifacts.
    if: github.ref == 'refs/heads/main' && (github.event_name != 'workflow_dispatch' || inputs.region == 'all')
    steps:
      - name: Download all tile artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: tiles_*

      - name: List all artifacts
        run: |
          echo "Listing all downloaded tile artifacts:"
          find artifacts -name "*.mbtiles" -type f -exec ls -lh {} \;

      - name: Set release month variable
        id: date
        run: echo "month=$(date '+%B %Y')" >> $GITHUB_OUTPUT

      # Publishes to a fresh tag every run. The old scheme rewrote "latest" in
      # place, so a download URL served different bytes depending on when it was
      # fetched: a vehicle could take a digest from the manifest and receive
      # content that no longer matched it. A tag that is never reused makes each
      # asset URL immutable, so a download that starts against one build stays
      # on that build.
      - name: Name the release
        id: publish
        run: |
          set -euo pipefail
          tag="tiles-$(date -u +%Y%m%dT%H%M%SZ)"
          count=$(find artifacts -name '*.mbtiles' -type f | wc -l)
          if [ "$count" -eq 0 ]; then
            echo "no tile artifacts to publish" >&2
            exit 1
          fi
          echo "publishing $count assets as $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      # A JavaScript action rather than the gh CLI: gh is not installed on the
      # self-hosted runners, and this is the action the firmware build already
      # uses on them.
      - name: Publish release
        uses: softprops/action-gh-release@v2.4.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ steps.publish.outputs.tag }}
          name: "Custom Shortbread Tiles - ${{ steps.date.outputs.month }}"
          body: "Generated from ${{ github.sha }}."
          prerelease: false
          files: artifacts/**/*.mbtiles
          fail_on_unmatched_files: true

      # Keeps a few generations so a download already in flight against an
      # older build can still finish.
      # Housekeeping must not be able to fail a good release, and this action is
      # not otherwise used on these runners.
      - name: Prune old tile releases
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const keep = 3;
            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });
            const tiles = releases
              .filter(r => r.tag_name.startsWith('tiles-'))
              .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
            for (const r of tiles.slice(keep)) {
              core.info(`deleting ${r.tag_name}`);
              await github.rest.repos.deleteRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: r.id,
              });
              try {
                await github.rest.git.deleteRef({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: `tags/${r.tag_name}`,
                });
              } catch (e) {
                core.warning(`could not delete tag ${r.tag_name}: ${e.message}`);
              }
            }

      - name: Generate app token for downloads rebuild
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: librescoot
          repositories: downloads.librescoot.org

      - name: Trigger downloads site rebuild
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ steps.app-token.outputs.token }}
          repository: librescoot/downloads.librescoot.org
          event-type: releases-changed
