name: Generate Custom Shortbread Tiles - Germany + Benelux + France + Italy

permissions:
  contents: write

on:
  schedule:
    - cron: '0 0 1 * *'  # Monthly on the 1st at midnight UTC
  workflow_dispatch:

jobs:
  generate_state_tiles:
    runs-on: self-hosted
    strategy:
      fail-fast: false
      matrix:
        state:
          - { name: "baden-wuerttemberg", url: "https://download.geofabrik.de/europe/germany/baden-wuerttemberg-latest.osm.pbf" }
          - { name: "bayern", url: "https://download.geofabrik.de/europe/germany/bayern-latest.osm.pbf" }
          - { name: "berlin_brandenburg", url: "https://download.geofabrik.de/europe/germany/brandenburg-latest.osm.pbf" }
          - { name: "bremen", url: "https://download.geofabrik.de/europe/germany/bremen-latest.osm.pbf" }
          - { name: "hamburg", url: "https://download.geofabrik.de/europe/germany/hamburg-latest.osm.pbf" }
          - { name: "hessen", url: "https://download.geofabrik.de/europe/germany/hessen-latest.osm.pbf" }
          - { name: "mecklenburg-vorpommern", url: "https://download.geofabrik.de/europe/germany/mecklenburg-vorpommern-latest.osm.pbf" }
          - { name: "niedersachsen", label: "Niedersachsen (incl. Bremen)", url: "https://download.geofabrik.de/europe/germany/niedersachsen-latest.osm.pbf" }
          - { name: "nordrhein-westfalen", url: "https://download.geofabrik.de/europe/germany/nordrhein-westfalen-latest.osm.pbf" }
          - { name: "rheinland-pfalz", url: "https://download.geofabrik.de/europe/germany/rheinland-pfalz-latest.osm.pbf" }
          - { name: "saarland", url: "https://download.geofabrik.de/europe/germany/saarland-latest.osm.pbf" }
          - { name: "sachsen", url: "https://download.geofabrik.de/europe/germany/sachsen-latest.osm.pbf" }
          - { name: "sachsen-anhalt", url: "https://download.geofabrik.de/europe/germany/sachsen-anhalt-latest.osm.pbf" }
          - { name: "schleswig-holstein", url: "https://download.geofabrik.de/europe/germany/schleswig-holstein-latest.osm.pbf" }
          - { name: "thueringen", url: "https://download.geofabrik.de/europe/germany/thueringen-latest.osm.pbf" }
          - { name: "netherlands", url: "https://download.geofabrik.de/europe/netherlands-latest.osm.pbf" }
          - { name: "belgium", url: "https://download.geofabrik.de/europe/belgium-latest.osm.pbf" }
          - { name: "luxembourg", url: "https://download.geofabrik.de/europe/luxembourg-latest.osm.pbf" }
          - { name: "ile-de-france", url: "https://download.geofabrik.de/europe/france/ile-de-france-latest.osm.pbf" }
          # Geofabrik has no per-regione Italian extracts; nord-ovest is the
          # smallest extract covering Lombardy (also includes Piedmont,
          # Liguria, Aosta Valley).
          - { name: "italy-nord-ovest", label: "Nord-Ovest (incl. Lombardy)", url: "https://download.geofabrik.de/europe/italy/nord-ovest-latest.osm.pbf" }
    steps:
      - uses: actions/checkout@v4

      - name: Download OSM PBF for ${{ matrix.state.name }}
        run: |
          echo "Downloading ${{ matrix.state.name }} PBF file..."
          wget -q -O /tmp/${{ matrix.state.name }}.osm.pbf ${{ matrix.state.url }}
          echo "Download completed for ${{ matrix.state.name }}"
          ls -lh /tmp/${{ matrix.state.name }}.osm.pbf

      - name: Generate tiles for ${{ matrix.state.name }}
        run: |
          echo "Generating tiles for ${{ matrix.state.name }}..."
          mkdir -p /tmp/tilemaker-artifacts
          sudo docker run --rm \
            -v $(pwd):/var/tm \
            -v /tmp:/tmp \
            -w /var/tm \
            --entrypoint tilemaker \
            versatiles/versatiles-tilemaker \
              --config tilemaker/config.json \
              --process tilemaker/process.lua \
              --input /tmp/${{ matrix.state.name }}.osm.pbf \
              --output /tmp/tilemaker-artifacts/tiles_${{ matrix.state.name }}.mbtiles
          echo "Tile generation completed for ${{ matrix.state.name }}"
          # Docker tilemaker runs as root and leaves the .mbtiles owned by
          # root with read-only perms for everyone else. The next step opens
          # it for writing via sqlite3 to add the geocoding-index tables, so
          # hand ownership back to the runner user.
          sudo chown $(id -u):$(id -g) /tmp/tilemaker-artifacts/tiles_${{ matrix.state.name }}.mbtiles
          ls -lh /tmp/tilemaker-artifacts/tiles_${{ matrix.state.name }}.mbtiles

      - name: Set up Python for geocoding index
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install geocoding index dependencies
        run: pip install -r requirements.txt

      - name: Build geocoding index for ${{ matrix.state.name }}
        run: |
          python3 build_places.py \
            /tmp/${{ matrix.state.name }}.osm.pbf \
            /tmp/tilemaker-artifacts/tiles_${{ matrix.state.name }}.mbtiles
          ls -lh /tmp/tilemaker-artifacts/tiles_${{ matrix.state.name }}.mbtiles

      - name: Upload tiles for ${{ matrix.state.name }}
        uses: actions/upload-artifact@v4
        with:
          name: tiles_${{ matrix.state.name }}
          path: /tmp/tilemaker-artifacts/tiles_${{ matrix.state.name }}.mbtiles

  release:
    needs: [generate_state_tiles]
    runs-on: self-hosted
    # Only publish to the `latest` release from main. Workflow runs on feature
    # branches still produce artifacts (downloadable from the workflow run UI)
    # but must not overwrite the production release.
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Download all tile artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List all artifacts
        run: |
          echo "Listing all downloaded tile artifacts:"
          find artifacts -name "*.mbtiles" -type f -exec ls -lh {} \;

      - name: Set release month variable
        id: date
        run: echo "month=$(date '+%B %Y')" >> $GITHUB_OUTPUT

      # Publishes to a fresh tag every run. The old scheme rewrote "latest" in
      # place, so a download URL served different bytes depending on when it was
      # fetched: a vehicle could take a digest from the manifest and receive
      # content that no longer matched it. A tag that is never reused makes each
      # asset URL immutable, so a download that starts against one build stays
      # on that build. gh uploads the files as part of the create call, so the
      # release is complete the moment it exists.
      - name: Publish release
        id: publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="tiles-$(date -u +%Y%m%dT%H%M%SZ)"
          mapfile -t files < <(find artifacts -name '*.mbtiles' -type f | sort)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "no tile artifacts to publish" >&2
            exit 1
          fi
          echo "publishing ${#files[@]} assets as $tag"
          gh release create "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Custom Shortbread Tiles - ${{ steps.date.outputs.month }}" \
            --notes "Generated $(date -u +%Y-%m-%dT%H:%M:%SZ) from ${GITHUB_SHA}." \
            "${files[@]}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "expected=${#files[@]}" >> "$GITHUB_OUTPUT"

      # gh create is synchronous, so this only guards against a partial upload
      # it failed to report. The manifest must never describe a short release.
      - name: Verify the release is complete
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          expected="${{ steps.publish.outputs.expected }}"
          got=$(gh release view "${{ steps.publish.outputs.tag }}" \
            --repo "$GITHUB_REPOSITORY" --json assets \
            --jq '[.assets[] | select(.size > 0)] | length')
          echo "$got/$expected assets present"
          if [ "$got" -ne "$expected" ]; then
            echo "release is short, refusing to publish the manifest" >&2
            exit 1
          fi

      # Keeps a few generations so a download already in flight against an
      # older build can still finish.
      - name: Prune old tile releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release list --repo "$GITHUB_REPOSITORY" --limit 100 \
            --json tagName,createdAt \
          | jq -r '[.[] | select(.tagName | startswith("tiles-"))]
                   | sort_by(.createdAt) | reverse | .[3:] | .[].tagName' \
          | while read -r old; do
              [ -n "$old" ] || continue
              echo "deleting $old"
              gh release delete "$old" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
            done

      - name: Generate app token for downloads rebuild
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: librescoot
          repositories: downloads.librescoot.org

      - name: Trigger downloads site rebuild
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ steps.app-token.outputs.token }}
          repository: librescoot/downloads.librescoot.org
          event-type: releases-changed
