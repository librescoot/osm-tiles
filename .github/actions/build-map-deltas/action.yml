name: Build map deltas for one region and hand the files on
description: >-
  Patches one verified region file against the recent published releases. On a
  main run the tiles and deltas are uploaded straight into the draft release
  from this runner, and the tiles are kept as the next run's delta base. On a
  branch run the deltas are kept as a workflow artifact instead.

inputs:
  region:
    description: Region ID, e.g. bremen
    required: true
  tiles:
    description: Path to the verified tiles_<region>.mbtiles
    required: true
  bases:
    description: How many recent published releases to build deltas against
    required: false
    default: '2'
  cache-dir:
    description: Runner directory for kept files; empty means $HOME/.cache/librescoot-tiles
    required: false
    default: ''
  release-id:
    description: Draft release to upload into; empty on a branch run
    required: false
    default: ''
  release-tag:
    description: Tag of that draft release
    required: false
    default: ''
  github-token:
    description: Token for listing and downloading releases and for the draft upload
    required: true

runs:
  using: composite
  steps:
    - name: Install HDiffPatch encoder
      shell: bash
      run: |
        set -euo pipefail
        curl --fail --silent --show-error --location --retry 3 \
          -o "$RUNNER_TEMP/hdiffpatch.zip" \
          https://github.com/sisong/HDiffPatch/releases/download/v5.1.3/hdiffpatch_v5.1.3_bin_linux64.zip
        echo "628963bf2ee9108a97260fa5eef44acd9ec94369b76090a957c9182b3abbb558  $RUNNER_TEMP/hdiffpatch.zip" | sha256sum -c -
        unzip -j -o "$RUNNER_TEMP/hdiffpatch.zip" 'linux64/hdiffz' -d "$RUNNER_TEMP/hdiff"
        chmod 0755 "$RUNNER_TEMP/hdiff/hdiffz"
        echo "$RUNNER_TEMP/hdiff" >> "$GITHUB_PATH"

    - name: Build deltas for ${{ inputs.region }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        TILE_CACHE_DIR: ${{ inputs.cache-dir }}
        REGION: ${{ inputs.region }}
        TILES: ${{ inputs.tiles }}
        BASES: ${{ inputs.bases }}
      run: |
        set -euo pipefail
        # A directory of its own: regions build side by side on one runner and
        # the generator patches every tiles_*.mbtiles it finds in it.
        work="$RUNNER_TEMP/map-deltas-$REGION"
        rm -rf "$work"
        mkdir -p "$work"
        ln -f "$TILES" "$work/tiles_$REGION.mbtiles" 2>/dev/null || cp "$TILES" "$work/tiles_$REGION.mbtiles"
        # Published bases are kept between runs, so only a release that is new
        # since last time is downloaded.
        python3 tools/create-map-deltas.py "$work" --bases "$BASES" \
          --cache-dir "${TILE_CACHE_DIR:-$HOME/.cache/librescoot-tiles}/bases"
        find "$work" -name '*.hdelta' -exec ls -lh {} + || true

    - name: Upload ${{ inputs.region }} to the draft release
      if: inputs.release-id != ''
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        TILE_CACHE_DIR: ${{ inputs.cache-dir }}
        REGION: ${{ inputs.region }}
        RELEASE_ID: ${{ inputs.release-id }}
        RELEASE_TAG: ${{ inputs.release-tag }}
      run: |
        set -euo pipefail
        work="$RUNNER_TEMP/map-deltas-$REGION"
        shopt -s nullglob
        # Tiles first, then the deltas that patch towards them.
        python3 tools/release-assets.py upload --release-id "$RELEASE_ID" \
          "$work/tiles_$REGION.mbtiles" "$work"/*.hdelta
        # Once uploaded, this very file is what the release will publish, so it
        # is also the next run's base: no download for the newest version.
        tools/tile-cache.sh adopt "$RELEASE_TAG" "$work"

    - name: Keep deltas for ${{ inputs.region }} as an artifact
      if: inputs.release-id == ''
      uses: actions/upload-artifact@v7
      with:
        name: tiles-delta-${{ inputs.region }}
        path: ${{ runner.temp }}/map-deltas-${{ inputs.region }}/*.hdelta
        if-no-files-found: ignore
        compression-level: 0

    - name: Clean up deltas for ${{ inputs.region }}
      if: always()
      shell: bash
      run: rm -rf "$RUNNER_TEMP/map-deltas-${{ inputs.region }}"
